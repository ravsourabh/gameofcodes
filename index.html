<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1018" />
    <meta name="description" content="Create original characters and produce your own Hindi and Hinglish satire show. A studio for desktop and VR." />
    <title>Game of Codes — Your characters. Your show.</title>
    <link rel="icon" type="image/png" href="/logo.png" />
  </head>
  <body>
    <style>
      html,body{margin:0;background:#10242a;color:#ece5d2}#boot-screen{position:fixed;inset:0;z-index:999;background:radial-gradient(ellipse at center,#203c3d,#0b1b23);display:grid;place-content:center;text-align:center;padding:28px;font-family:Georgia,serif}#boot-screen[hidden]{display:none}#boot-screen h1{font-size:32px;font-weight:400;letter-spacing:3px}#boot-quote{max-width:460px;font-size:20px;line-height:1.6;min-height:64px}#boot-status{font:12px system-ui;color:#a6b9a8}#boot-screen a{color:#d4bb83;font:13px system-ui}.boot-mark{color:#d4bb83;font-size:32px;animation:boot-breathe 2s ease-in-out infinite}@keyframes boot-breathe{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.boot-mark{animation:none}}
    </style>
    <div id="boot-screen" role="status"><div class="boot-mark" aria-hidden="true">&#9814;</div><h1>GAME OF CODES</h1><p id="boot-quote">Your characters. Your premise. Your show.</p><p id="boot-status" aria-live="polite">Opening your studio…</p><a id="boot-retry" href="" hidden>Try again</a><noscript>Enable JavaScript to enter your studio.</noscript></div>
    <script src="/arrival.js"></script>
    <div id="app"></div>
    <script type="module" src="/src/session-main.ts"></script>
  </body>
</html>
