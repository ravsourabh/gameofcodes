name: Deploy to gameofcodes.si

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: 167.71.227.218
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/sovereign

            # Pull latest code from GitHub
            git pull origin main

            # Rebuild Docker image
            docker build -t sovereign:latest .

            # Replace container with zero-downtime swap
            docker stop sovereign || true
            docker rm sovereign || true
            docker run -d \
              --name sovereign \
              --restart always \
              -p 5443:5443 \
              --env-file ~/sovereign/sovereign.env \
              -v sovereign-data:/app/.sovereign \
              sovereign:latest

            echo "Deployed $(git rev-parse --short HEAD) at $(date)"
