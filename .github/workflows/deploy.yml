name: Deploy to gameofcodes.si

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to server
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          # Write deploy key
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 167.71.227.218 >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key deploy@167.71.227.218 << 'ENDSSH'
            set -e
            cd ~/sovereign

            # Pull latest code from GitHub
            git pull origin main

            # Rebuild Docker image
            docker build -t sovereign:latest .

            # Replace container
            docker stop sovereign || true
            docker rm sovereign || true
            docker run -d \
              --name sovereign \
              --restart always \
              -p 5443:5443 \
              --env-file ~/sovereign/sovereign.env \
              -v sovereign-data:/app/.sovereign \
              sovereign:latest

            echo "Deployed $(git rev-parse --short HEAD) at $(date)"
          ENDSSH
